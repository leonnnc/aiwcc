name: Build AIWCC Desktop

on:
  push:
    branches: [main]
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiwcc-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Validate and package Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate desktop package
        run: |
          node --check electron/main.cjs
          node -e "const p=require('./package.json'); if (!p.main || !p.build || !p.build.linux) process.exit(1)"
          test -s index.html
          test -s bridge/server.py
      - name: Validate and test Bridge
        run: |
          python -m py_compile bridge/server.py bridge/test_server.py
          python -m unittest discover -s bridge -p 'test_*.py' -v
      - name: Build Linux packages
        run: npm run dist:linux
      - name: Verify installers
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          ls -lh dist/
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: aiwcc-linux-installers
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30
